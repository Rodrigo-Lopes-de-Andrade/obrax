# Stack de desenvolvimento local (Postgres + Redis).
# Credenciais são throwaway de dev — não usar em produção.
services:
  postgres:
    image: postgres:16
    container_name: obrax-postgres
    environment:
      POSTGRES_USER: obrax
      POSTGRES_PASSWORD: obrax
      POSTGRES_DB: obrax
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obrax -d obrax"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7
    container_name: obrax-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Mock local do object store (Supabase Storage é S3-compatível). O
  # StorageClient (app/integrations/storage.py) fala S3 via boto3 — mesmo código
  # aponta pro MinIO em dev e pro endpoint S3 do Supabase em staging/prod.
  minio:
    # minio/minio e minio/mc saíram do Docker Hub (404) — usamos as builds da
    # Chainguard. Tag -dev porque traz shell (healthcheck e o init usam sh).
    image: cgr.dev/chainguard/minio:latest-dev
    user: "0" # a imagem roda como 65532 e o volume nomeado nasce de root
    container_name: obrax-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: obrax
      MINIO_ROOT_PASSWORD: obrax-dev-secret
    ports:
      - "9000:9000" # API S3
      - "9001:9001" # console web
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Cria os buckets de dev uma vez (idempotente). Sai com 0 após criar.
  minio-init:
    image: cgr.dev/chainguard/minio-client:latest-dev
    container_name: obrax-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 obrax obrax-dev-secret; do sleep 1; done;
      mc mb -p local/documents-dev local/photos-dev local/pdfs-dev local/exports-dev;
      exit 0;
      "

volumes:
  pgdata:
  miniodata:
