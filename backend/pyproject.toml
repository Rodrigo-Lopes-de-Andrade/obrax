[project]
name = "obrax-backend"
version = "0.1.0"
description = "Obrax backend — mini-ERP SaaS para construtoras (FastAPI + SQLAlchemy + Alembic)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.1,<4.0",
    "python-dotenv>=1.0,<2.0",
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.30,<1.0",
    "gunicorn>=22.0,<23.0",
    "pydantic[email]>=2.9,<3.0",
    "pyjwt>=2.9,<3.0",
    "passlib[argon2]>=1.7.4,<2.0",
    "argon2-cffi>=23.1,<24.0",
    "boto3>=1.34,<2.0",
    "openpyxl>=3.1,<4.0",
    "python-multipart>=0.0.9,<1.0",
]

[project.optional-dependencies]
# Observability (B11.2): OpenTelemetry → OTLP. Extra opcional — o app roda sem
# ele (seam no-op). Instale em staging/prod: `pip install '.[observability]'`.
observability = [
    "opentelemetry-sdk>=1.27,<2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0,<1.0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0,<1.0",
    "opentelemetry-instrumentation-logging>=0.48b0,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1.0",
    "mypy>=1.11,<2.0",
    "pytest>=8.0,<9.0",
    "ruff>=0.6,<1.0",
    "locust>=2.31,<3.0",  # B11.4 — teste de carga (loadtest/locustfile.py)
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []

[[tool.mypy.overrides]]
module = [
    "passlib.*",
    "boto3.*",
    "botocore.*",
    "openpyxl.*",
    # OTel é extra opcional (não instalado no CI base); imports são lazy/guardados.
    "opentelemetry.*",
    "locust.*",  # dep de dev (loadtest), sem stubs
]
ignore_missing_imports = true
