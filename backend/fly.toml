# Fly.io — backend Obrax (FastAPI). Preencha `app` e confira `primary_region`.
# Deploy: `fly deploy` (usa este arquivo + Dockerfile). Ver RUNBOOK §3.
app = "obrax"              # app criado no Fly (personal)
primary_region = "gru"     # São Paulo; alinhe com a região do Supabase

[build]
  dockerfile = "Dockerfile"

[deploy]
  strategy = "bluegreen"   # S12.6 — virada sem downtime
  # Migrations forward-only (expand-contract) ANTES de trocar de versão. Usam o
  # SESSION pooler (:5432) via secret SUPABASE_DB_URL_MIGRATIONS — ver RUNBOOK §3.
  release_command = "sh -c 'DATABASE_URL=\"$SUPABASE_DB_URL_MIGRATIONS\" alembic upgrade head'"

# Envs NÃO-secretas. Segredos vão em `fly secrets set` (nunca neste arquivo):
#   JWT_SECRET, DATABASE_URL (transaction pooler :6543), APP_USER_DATABASE_URL,
#   APP_ADMIN_DATABASE_URL, SUPABASE_DB_URL_MIGRATIONS (session :5432), STORAGE_*,
#   SUPABASE_URL, SUPABASE_SERVICE_KEY, PDF_RENDERER_URL,
#   OTEL_EXPORTER_OTLP_HEADERS (api-key=<license NRAL>), UAZAPI_* (Módulo 3).
[env]
  ENVIRONMENT = "production"
  LOG_FORMAT = "json"
  PORT = "8080"
  OTEL_SERVICE_NAME = "obrax-api"
  OTEL_EXPORTER_OTLP_ENDPOINT = "https://otlp.nr-data.net"
  REALTIME_ENABLED = "true"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1   # suba p/ 2+ para alta disponibilidade

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

# Health check — readiness do blue-green. /health responde 200 quando a app
# subiu; o smoke test (`scripts.smoke_test`) é o gate mais fundo antes do cutover.
[[http_service.checks]]
  interval = "15s"
  timeout = "3s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
